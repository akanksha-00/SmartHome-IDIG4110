services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - ./backend/mosquitto/data:/mosquitto/data
      - ./backend/mosquitto/log:/mosquitto/log
  mongodb:
    image: mongo:8
    container_name: smarthome-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./backend/mongodb_data:/data/db
  fastapi:
    build:
      context: ./backend/smarthome-api
    container_name: smarthome-fastapi
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      STORAGE_BACKEND: json
      #STORAGE_BACKEND: mongo
      #MONGODB_URI: mongodb://mongodb:27017
      #MONGODB_DB: smarthome
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mosquitto
  frontend:
    build:
      context: ./frontend/smart_home
    container_name: smarthome-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8080"
  proxy:
    build:
      context: ./frontend/smart_home/tool
    container_name: smarthome-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      PROXY_HOST: "0.0.0.0"
      BACKEND_HOST: fastapi
    depends_on:
      - fastapi
volumes:
  mongodb_data:
      
