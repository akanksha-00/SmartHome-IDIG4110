services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smarthome-mosquitto
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - ./backend/mosquitto/data:/mosquitto/data
      - ./backend/mosquitto/log:/mosquitto/log
  mongodb:
    image: mongo:8
    container_name: smarthome-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./backend/mongodb_data:/data/db
  fastapi:
    build:
      context: ./backend/smarthome-api
    container_name: smarthome-fastapi
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      STORAGE_BACKEND: json
      #STORAGE_BACKEND: mongo
      #MONGODB_URI: mongodb://mongodb:27017
      #MONGODB_DB: smarthome
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mosquitto
volumes:
  mongodb_data:
      
